<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재정지원사업 보고서 작성 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 좌측 목차형 내비 + 우측 작업면. 수도권 표지색(초록)을 액센트로, 공문서 종이결 중립색 */
:root{
  --paper:#f6f7f4; --surface:#ffffff; --sunk:#eceee8; --ink:#1c2420; --ink-2:#4b5650; --ink-3:#7c8781;
  --line:#d8dcd4; --accent:#1f5c46; --accent-ink:#ffffff; --accent-soft:#e3eee8;
  --ok:#2f7a4f; --ok-soft:#e2f1e7; --warn:#a5650b; --warn-soft:#fbefd9; --bad:#b23a2e; --bad-soft:#f8e3e0;
  --link:#1f5c46;
  --f-display:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; --f-body:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; --f-mono:"Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121614; --surface:#1a201d; --sunk:#202723; --ink:#e6ebe7; --ink-2:#b2bcb5; --ink-3:#86918a;
  --line:#313a35; --accent:#6cc19c; --accent-ink:#0d1a14; --accent-soft:#1f3329;
  --ok:#74c995; --ok-soft:#1d3226; --warn:#e3a94f; --warn-soft:#352914; --bad:#ef8a7e; --bad-soft:#3a1f1c; --link:#7fd0ab; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#1a201d; --sunk:#202723; --ink:#e6ebe7; --ink-2:#b2bcb5; --ink-3:#86918a;
  --line:#313a35; --accent:#6cc19c; --accent-ink:#0d1a14; --accent-soft:#1f3329;
  --ok:#74c995; --ok-soft:#1d3226; --warn:#e3a94f; --warn-soft:#352914; --bad:#ef8a7e; --bad-soft:#3a1f1c; --link:#7fd0ab; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.65;letter-spacing:-0.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-0.02em;text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.mono{font-family:var(--f-mono);letter-spacing:0;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.g{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.sample{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 60px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding-block:14px;position:sticky;top:61px;align-self:start;max-height:calc(100vh - 61px);overflow:auto}
.navgrp{padding:8px 16px 4px;font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.navbtn{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;background:none;padding:7px 16px;cursor:pointer;color:var(--ink-2);border-left:3px solid transparent}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.navbtn .k{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:26px}
.navbtn .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

main{padding-block:22px 80px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.vhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin-bottom:18px}
.vhead h2{font-size:24px;font-weight:700}
.vhead p{margin:4px 0 0;color:var(--ink-2);max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--link);padding-inline:6px}
.btn.sm{padding:3px 9px;font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right}
table.t tr.sum td{background:var(--sunk);font-weight:600}
table.t input,table.t select{padding:4px 6px}
table.t select{min-width:72px}
table.t td.in{padding:3px 4px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--sunk);color:var(--ink-2)}
.key{display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:2px 9px 2px 7px;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%);white-space:nowrap}
.guide{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.guide b{color:var(--ink)}
.guide ol{margin:4px 0 0;padding-left:18px}
.src{font-size:11.5px;color:var(--ink-3)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);gap:0;align-items:stretch}
.flow .arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px}
.cell{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--surface);font-size:12.5px;min-width:0}
.cell .h{font-weight:600;color:var(--ink)}
.cell.pl{border-left:3px solid var(--warn)}
.cell.rp{border-left:3px solid var(--accent)}
.cell.ap{border-left:3px solid var(--ink-2)}
.cell button{font-size:11.5px}
.maphead{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);font-size:11px;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.maprow{margin-bottom:8px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tl{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.tl:last-child{border-right:0}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.tl.now{background:var(--accent-soft)}
.tl .w{font-weight:600}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.checks{display:flex;flex-direction:column}
.chk{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.taskcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.taskcard .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.taskcard .hd .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.secnav .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:4px 8px;font-size:12px}

/* 문서 미리보기 (한글 서식 근사: 본문 12pt, 줄간격 160%, 고딕) */
.docwrap{background:var(--sunk);border-radius:var(--r);padding:18px 12px;overflow-x:auto}
.doc{background:#fff;color:#111;width:min(794px,100%);margin:0 auto;padding:56px 64px;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:12pt;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.doc h1{font-size:20pt;text-align:center;margin:0 0 8px}
.doc h2{font-size:15pt;margin:28px 0 10px;padding:4px 0;border-bottom:2px solid #1f5c46}
.doc h3{font-size:13pt;margin:18px 0 8px}
.doc h4{font-size:12pt;margin:12px 0 6px}
.doc p{margin:4px 0}
.doc .pre{white-space:pre-wrap}
.doc table{border-collapse:collapse;width:100%;font-size:11pt;margin:8px 0;font-family:inherit}
.doc th,.doc td{border:1px solid #555;padding:4px 6px;vertical-align:middle}
.doc th{background:#e9efe9}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums}
.doc .cover{border:3px double #1f5c46;padding:40px 24px;text-align:center;margin-bottom:24px}
.doc .cover .reg{display:inline-block;background:#1f5c46;color:#fff;padding:2px 12px;font-size:11pt;margin-bottom:24px}
.doc .kmark{display:inline-block;background:#1f5c46;color:#fff;font-size:9pt;padding:0 8px 0 5px;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%);margin-left:6px;vertical-align:middle}
.doc .empty{color:#a33;background:#fff2f0}
.doc .ai{font-size:9.5pt;color:#555}
.doc .pb{border-top:1px dashed #bbb;margin:30px -64px;position:relative}
.doc .pb::after{content:"쪽 나눔";position:absolute;right:8px;top:-9px;font-size:9px;color:#999;background:#fff;padding:0 4px;font-family:inherit}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 8px;gap:2px}
  .navgrp{display:none}
  .navbtn{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  .navbtn.on{border-bottom-color:var(--accent)}
  .navbtn .dot{margin-left:4px}
  .flow,.maphead{grid-template-columns:minmax(0,1fr)}
  .maphead{display:none}
  .flow .arrow{transform:rotate(90deg);height:18px}
  .doc{padding:28px 20px}
  .doc .pb{margin-inline:-20px}
}

.dz{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.dz.on{border-color:var(--accent);background:var(--accent-soft)}
.fl{display:flex;flex-direction:column;gap:6px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface)}
.fi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projsel{display:flex;gap:6px;align-items:center}
.projsel select{width:auto;max-width:230px}
.busy{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.busy::before{content:"";width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:16px}
.step{padding:10px 12px;border-right:1px solid var(--line);font-size:12.5px;min-width:0}
.step:last-child{border-right:0}
.step b{display:block;font-size:13px}
.step.done{background:var(--ok-soft)}
.step.cur{background:var(--accent-soft)}
table.t textarea{min-height:52px;font-size:12px}
.lvl2{padding-left:14px}.lvl3{padding-left:28px}.lvl4{padding-left:42px}
pre.prev{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--sunk);padding:10px;border-radius:4px;font-size:12px;margin:6px 0 0}
.tour{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;z-index:40;display:flex;flex-direction:column;gap:8px}
.tour .tstep{font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.tour h4{margin:0;font-size:15px}
.tour p{margin:0;font-size:13px;color:var(--ink-2)}
.tour .dots{display:flex;gap:4px}.tour .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.tour .dots i.on{background:var(--accent)}
.demobar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:8px 12px;margin-bottom:14px;font-size:13px}
.demobar b{color:var(--ink)}
.demo-card{border:1px solid var(--accent);background:var(--accent-soft)}
.draftbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}
.ideas{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.ideas li{margin:2px 0}
.draftpre{white-space:pre-wrap;background:var(--surface);border:1px dashed var(--accent);border-radius:4px;padding:8px 10px;font-size:12.5px;max-height:260px;overflow:auto}
.doc .draft{background:#fff8dc;border-left:3px solid #c9a227;padding:2px 8px;margin:4px 0}
.doc .draft .dlabel{display:inline-block;font-size:9pt;font-weight:700;color:#8a6d00;margin-top:2px}
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);background:var(--surface)}
</style>
<div class="top">
  <div class="brand"><b>재정지원사업 보고서 작성 플랫폼</b><span id="brandSub">기본계획 · 평가(실적)보고서 · 사업계획서 연계 표준 자동화</span></div>
  <span class="sp"></span>

<script>
"use strict";
/* ---- 02.template.js ---- */

const G=(area,sec,n,variant)=>({area,sec,n,variant:variant||""});
const SEC=(id,no,title,kind,o)=>Object.assign({id,no,title,kind,src:"",group:"",keys:0,evalArea:"",guide:[],from:[],onlyVariant:""},o||{});
const TEMPLATES={
 "uni-innov":{

const LKEY="fin-support-platform-v1";
const Store={
  mode:"local", db:null, writing:false, pending:null, srcCache:{},
  async init(){
    try{ if(window.claude&&typeof window.claude.use==="function"){ const db=await window.claude.use("db"); if(db){this.db=db;this.mode="db";} } }catch(e){}
  },
  lsGet(){try{return JSON.parse(localStorage.getItem(LKEY)||"null")||{projects:{},sources:{}}}catch(e){return {projects:{},sources:{}}}},
  lsSet(o){try{localStorage.setItem(LKEY,JSON.stringify(o));return true}catch(e){return false}},
  async list(){
    if(this.mode==="db"){ try{ const q=await this.db.collection("projects").get(); return q.docs.map(d=>{const x=d.data();return {id:d.id,name:x.name,program:x.profile&&x.profile.programName,updatedAt:x.updatedAt||0}}).sort((a,b)=>b.updatedAt-a.updatedAt);}catch(e){ toast("저장소를 읽지 못했습니다: "+(e.code||e.message)); return []; } }
    const o=this.lsGet(); return Object.values(o.projects).map(x=>({id:x.id,name:x.name,program:x.profile.programName,updatedAt:x.updatedAt})).sort((a,b)=>b.updatedAt-a.updatedAt);
  },
  async load(id){
    if(this.mode==="db"){ const s=await this.db.doc("projects/"+id).get(); if(!s.exists)return null; const x=clone(s.data()); x.id=id; return x; }
    const o=this.lsGet(); return o.projects[id]?clone(o.projects[id]):null;
  },
  save(p){ if(p&&p.demo){ setSave("데모 · 저장 안 함"); return; } p.updatedAt=Date.now(); this.pending=clone(p); this.flush(); },
  async flush(){
    if(this.writing||!this.pending)return; this.writing=true; const p=this.pending; this.pending=null;
    try{
      if(this.mode==="db"){ const body={name:p.name,profile:p.profile,data:p.data,createdAt:p.createdAt||Date.now(),updatedAt:p.updatedAt}; await this.db.doc("projects/"+p.id).set(body); }
      else { const o=this.lsGet(); o.projects[p.id]=p; if(!this.lsSet(o)) throw {code:"local_full",message:"브라우저 저장 공간 부족"}; }
      setSave((this.mode==="db"?"저장됨 ":"이 브라우저에 저장 ")+new Date().toTimeString().slice(0,5));
    }catch(e){ setSave("저장 실패"); toast(e.code==="quota_exceeded"?"저장 공간이 가득 찼습니다. 쓰지 않는 사업이나 원문을 지워 주세요":e.code==="invalid_argument"?"이 보기에서는 저장 권한이 없습니다(읽기 전용)":"저장하지 못했습니다: "+(e.message||e.code)); }
    this.writing=false; if(this.pending) this.flush();
  },
  async remove(id){ if(this.mode==="db"){ const ss=await this.listSources(id); for(const s of ss){ try{await this.db.doc(`projects/${id}/sources/${s.id}`).delete()}catch(e){} } await this.db.doc("projects/"+id).delete(); } else { const o=this.lsGet(); delete o.projects[id]; delete o.sources[id]; this.lsSet(o);} },
  async listSources(id){
    if(this.mode==="db"){ try{ const q=await this.db.collection(`projects/${id}/sources`).get(); return q.docs.map(d=>Object.assign({id:d.id},d.data())); }catch(e){ return []; } }
    const o=this.lsGet(); return Object.values((o.sources||{})[id]||{});
  },
  async saveSource(id,src){
    if(String(id).startsWith("demo"))return;
    const body={name:src.name,role:src.role,chars:src.chars,text:(src.text||"").slice(0,70000),truncated:(src.text||"").length>70000,addedAt:Date.now()};
    if(this.mode==="db"){ await this.db.doc(`projects/${id}/sources/${src.id}`).set(body); return; }
    const o=this.lsGet(); o.sources=o.sources||{}; o.sources[id]=o.sources[id]||{}; o.sources[id][src.id]=Object.assign({id:src.id},body); if(!this.lsSet(o)){ delete o.sources[id][src.id]; o.sources[id][src.id]=Object.assign({id:src.id},body,{text:body.text.slice(0,15000),truncated:true}); this.lsSet(o); }
  },
  async delSource(id,sid){ if(String(id).startsWith("demo"))return; if(this.mode==="db"){ await this.db.doc(`projects/${id}/sources/${sid}`).delete(); return; } const o=this.lsGet(); if(o.sources&&o.sources[id]){delete o.sources[id][sid]; this.lsSet(o);} }
};

function decodeXmlEnt(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&")}
function xmlToText(x,P_END,TAB,CELL){ x=x.replace(new RegExp(P_END,"g"),"\n").replace(new RegExp(TAB,"g"),"\t"); if(CELL)x=x.replace(new RegExp(CELL,"g")," | "); x=x.replace(/<[^>]+>/g,""); return decodeXmlEnt(x); }
function cleanText(t){ return t.replace(/\r/g,"").replace(/[  ]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); }
async function pdfText(buf){
  await loadLib("pdf"); await loadLib("pdfw");
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=LIBS.pdfw;
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise; const out=[];
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); let lastY=null, lastEnd=null, line="";
    const flush=()=>{ if(line){ out.push(line.replace(/(\S+)(?: \1){2,}/g,"$1")); } line=""; };
    tc.items.forEach(it=>{ if(!it.str&&!it.hasEOL)return; const x=it.transform[4], y=Math.round(it.transform[5]), fs=Math.abs(it.transform[0])||10;
      if(lastY!==null&&Math.abs(y-lastY)>2){ flush(); lastEnd=null; }
      if(line&&lastEnd!==null&&x-lastEnd>fs*0.25&&!/\s$/.test(line)&&!/^\s/.test(it.str))line+=" ";
      line+=it.str; lastY=y; lastEnd=x+(it.width||0); if(it.hasEOL){ flush(); lastY=null; lastEnd=null; } });
    flush(); out.push(""); }

  if(which==="b1"){ const b=calcB1(); if(!b.tb)return null; const re=new RegExp(rule.kw); const s=b.rows.filter(r=>re.test(r.name)).reduce((a,r)=>a+r.bud,0); if(!b.rows.some(r=>re.test(r.name)))return null; return {val:pct(s,b.tb),lim:dat().meta.flagPrev==="O"&&rule.altMax?rule.altMax:rule.max}; }
  const b=calcB2(); if(!b.C)return null; const re=new RegExp(rule.kw); if(!b.ent.some(e=>re.test(e.k)))return null; const s=b.ent.filter(e=>re.test(e.k)).reduce((a,e)=>a+e.A+e.B,0); return {val:pct(s,b.base),lim:dat().meta.flag==="O"&&rule.altMax?rule.altMax:rule.max};
}
function calcBonus(){ const m=prof().modules.bonus; const b=dat().bonus; const tot=n(b.total); const mo=tot-(b.ex||[]).reduce((s,x)=>s+n(x),0); const r1=pct(n(b.t1),mo), r2=pct(n(b.t2),mo), sum=r1+r2;
  const re=m.rowEdges||[], ce=m.colEdges||[]; const ri=re.filter(e=>r1>=e).length, ci=ce.filter(e=>sum>=e).length; const pts=(isFinite(sum)&&mo>0&&m.table&&m.table[ri])?m.table[ri][ci]:null;
  return {mo,r1,r2,sum,ri,ci,pts,selfR:pct(n((b.ex||[])[m.selfIdx||0]),tot)}; }
function kpiAch(k){const t=n(k.t1),a=n(k.act); if(!t||k.act===""||k.act==null)return NaN; const lower=new RegExp(prof().modules.kpi.lowerKw||"감소|탈락률").test(k.name); return lower?(n(k.base)-a)/(n(k.base)-t)*100:a/t*100;}
const textFilled=t=>(t||"").trim().length>=20;
function secData(docId,secId){ const d=dat().sec; d[docId]=d[docId]||{}; d[docId][secId]=d[docId][secId]||{}; return d[docId][secId]; }

function secRef(ref){const [d,s]=String(ref).split(":");const doc=docById(d);const sec=doc&&doc.sections.find(x=>x.id===s);return sec?{doc,sec}:null}
function visibleSecs(doc){return doc.sections.filter(vOK)}
function taskCheck(){ const out=[];let ok=true; const gs=taskGroups();
  gs.forEach(a=>{const c=tasksBy(a.area).length; if(c!==a.n){ok=false;out.push(`${a.sec} ${a.area}: ${c}/${a.n}개`)}});
  const nr=dat().tasks.filter(t=>!t.result||!t.status); if(nr.length){ok=false;out.push(`이행 실적·달성 여부 미기재: ${nr.map(t=>"과제"+(t.no||dat().tasks.indexOf(t)+1)).join(", ")}`)}
  return {ok,out,need:gs.reduce((s,a)=>s+a.n,0)}; }
function secStatus(doc,s){
  const d=secData(doc.id,s.id);
  if(s.kind==="head")return "";
  if(s.kind==="text")return textFilled(d.text)||(s.from.length&&draftFrom(s))?"ok":d.draft?"warn":"bad";
  if(s.kind==="pp"){ const fs=prof().ppFields.filter(f=>!f.short); const c=fs.filter(f=>textFilled(d[f.k])).length; const keysOk=!s.group||tasksBy(s.group).length>=(s.keys||0); return c===fs.length&&keysOk?"ok":c>0||d.draft?"warn":"bad"; }
  if(s.kind==="derived")return s.from.every(r=>{const x=secRef(r);return !x||!vOK(x.sec)||textFilled(secData(x.doc.id,x.sec.id).f2)})?"ok":"warn";
  if(s.src==="tasks")return taskCheck().ok?"ok":"warn";
  if(s.src==="kpi")return dat().kpi.length&&dat().kpi.every(k=>k.name&&k.t1!==""&&k.act!==""&&k.act!=null)?"ok":"warn";
  if(s.src==="gov")return dat().gov.length?"ok":"bad";
  if(s.src==="budget"){const b=calcB1();return b.tb&&Math.abs(b.tb-n(dat().meta.totalPrev))<1?"ok":"warn"}
  return "warn";
}
function draftFrom(s){ return s.from.map(r=>{const x=secRef(r);if(!x)return "";const d=secData(x.doc.id,x.sec.id);return d.text||d.f1||""}).filter(Boolean).join("\n\n"); }
function checks(){
  const L=[]; const add=(lv,area,msg,go)=>L.push({lv,area,msg,go}); const pr=prof(), D=dat(), M=pr.modules;
  if(!pr.docs.length) add("bad","사업 구조","문서 서식이 아직 없습니다 — ‘사업 구조 설정’에서 서식을 올리거나 문서를 추가하세요","setup");
  pr.evalAreas.filter(vOK).forEach(a=>{ if(!pr.docs.some(d=>d.sections.some(s=>s.evalArea===a.id))) add("warn","평가 매칭",`평가영역 ‘${a.name}’에 연결된 보고서 항목이 없음`,"setup"); });
  if(M.tasks.on){ const tc=taskCheck(); add(tc.ok?"ok":"bad",M.tasks.label,tc.ok?`세부영역별 ${M.tasks.label} ${tc.need}개 지정·실적 기재 완료`:tc.out.join(" · "),"tasks");
    D.tasks.forEach(t=>{ if(t.planName&&norm(t.planName)!==norm(t.name)) add("warn",M.tasks.label,`과제명 불일치: ‘${t.name}’ ↔ 계획서 ‘${t.planName}’`,"tasks"); }); }
  pr.docs.forEach(doc=>visibleSecs(doc).forEach(s=>{ const d=secData(doc.id,s.id);
    if(s.kind==="pp"){ const f2=pr.ppFields.find(f=>f.k==="f2"); if(!textFilled(d.f2)) add("bad",doc.name,`${s.no} ${s.title}: ${f2?f2.l.split("(")[0].trim():"계획"} 미작성 → 다음 문서로 이어지지 않음`,"doc:"+doc.id+":"+s.id); else if(!d.basis) add("warn",doc.name,`${s.no}: 계획의 근거(규정·결재문서) 미기재`,"doc:"+doc.id+":"+s.id); }
    if(s.kind==="text"&&!textFilled(d.text)&&!(s.from.length&&draftFrom(s))) add("warn",doc.name,`${s.no} ${s.title} 미작성${d.draft?" — 내용(안) 준비됨, 확인 후 적용":" — 내용(안) 제시 기능 사용 가능"}`,"doc:"+doc.id+":"+s.id); }));
  pr.docs.forEach(doc=>{ if(doc.pageLimit){ const chars=(docHTML(doc).replace(/<[^>]+>/g,"").length); const pages=chars/1400; if(pages>doc.pageLimit) add("warn",doc.name,`예상 분량 약 ${Math.round(pages)}쪽 — 한도 ${doc.pageLimit}쪽 초과 가능`,"out"); } });
  if(M.kpi.on){ const kc=D.kpi.length; add(kc>=(M.kpi.min||1)&&kc<=(M.kpi.max||99)?"ok":"warn",M.kpi.label,`지표 ${kc}개 (권장 ${M.kpi.min}~${M.kpi.max}개)`,"kpi");
    D.kpi.forEach(k=>{ if(k.base===""||k.base==null) add("bad",M.kpi.label,`‘${k.name}’ 기준값 없음`,"kpi");
      const a=kpiAch(k); if(isFinite(a)&&a<100) add("warn",M.kpi.label,`‘${k.name}’ 달성도 ${f1(a)}% — 미달성 사유·개선방안 기술`,"kpi");
      if(k.src&&["base","t1","t2","t3"].some(f=>k.src[f]!==""&&k.src[f]!=null&&Math.abs(n(k[f])-n(k.src[f]))>1e-9)) add("bad",M.kpi.label,`‘${k.name}’ 기준·목표값이 확정값(${["base","t1","t2","t3"].map(f=>f1(n(k.src[f]))).join("/")})과 다름 — 임의 변경 불가`,"kpi");
      const fm=(k.formula||"").split("=")[0].trim(); if(fm&&fm!==k.name&&D.kpi.some(o=>o!==k&&o.name===fm)) add("bad",M.kpi.label,`‘${k.name}’ 산출식이 다른 지표명(‘${fm}’)으로 시작 — 복사 오류`,"kpi");
      if(!k.unit||/^n\/?a$/i.test(String(k.unit).trim())) add("warn",M.kpi.label,`‘${k.name}’ 단위 미기재(${k.unit||"공란"})`,"kpi");
      if(k.act===""||k.act==null) add("warn",M.kpi.label,`‘${k.name}’ 실적값 미입력`,"kpi"); });
    if(M.tasks.on&&D.kpi.some(k=>k.links)){ const linked=new Set(D.kpi.flatMap(k=>String(k.links||"").split(/[,\s]+/).filter(Boolean))); const nl=D.tasks.filter(t=>t.no&&!linked.has(String(t.no))); if(nl.length) add("warn",M.kpi.label,`연계 지표가 없는 ${M.tasks.label}: ${nl.map(t=>"과제"+t.no).join(", ")}`,"kpi"); } }
  if(M.finance.on){ const b1=calcB1(), tp=n(D.meta.totalPrev);
    if(pr.budgetItems.length) add(tp&&Math.abs(b1.tb-tp)<1?"ok":"bad","전년도 재정",tp?`비목별 예산 합계 ${won(b1.tb)} / 최종 사업비 ${won(tp)}백만원 ${Math.abs(b1.tb-tp)<1?"일치":"불일치"}`:"전년도 최종 사업비 총액 미입력","finance");
    pr.rules.filter(r=>r.type!=="carry").forEach(r=>{ const e=ruleEval(r,"b1"); if(e) add(e.val<=e.lim?"ok":"bad","전년도 재정",`${r.label} ${f1(e.val)}% (한도 ${e.lim}%)`,"finance"); });
    if(b1.tb){ b1.rows.forEach(r=>{const sh=pct(r.bud,b1.tb); if(sh>(pr.concentration||40)) add("warn","전년도 재정",`${r.name} 비중 ${f1(sh)}% — 특정 비목 편중, 편성 사유 설명 필요`,"finance")}); if(b1.rows.every(r=>r.exeRaw===""||r.exeRaw==null)) add("warn","전년도 재정","집행액 미입력 — 집행률 산출 불가","finance"); }

    else { pr.rules.forEach(r=>{ const e=ruleEval(r,"b2"); if(e) add(e.val<=e.lim?"ok":r.type==="carry"?"warn":"bad","금년도 재정",`${r.label} ${f1(e.val)}% (한도 ${e.lim}%${r.altMax&&D.meta.flag==="O"?", "+r.altLabel:""})`,"finance"); });
      const exp=n(D.meta.budgetCur)+n(D.meta.carry); add(Math.abs(b2.C-exp)<1?"ok":"bad","금년도 재정",`비목 합계 ${won(b2.C)} / 사업비+이월금 ${won(exp)}백만원`,"finance"); }
    const a3=Object.values(D.area3); if(a3.length&&a3.some(v=>n(v[0]))&&a3.every(v=>n(v[0])===n(v[1])&&n(v[1])===n(v[2]))) add("warn","금년도 재정","영역별 예산이 연도마다 같은 값 — 확정 사업비로 재산정 필요","finance");
    if(pr.equipThreshold){ const big=D.equip.filter(e=>n(e.unit)>=pr.equipThreshold); if(big.length) add("warn","장비",`${won(pr.equipThreshold)}백만원 이상 장비 ${big.length}건 — 사전 승인·집행계획 필수`,"finance"); } }
  if(M.bonus&&M.bonus.on&&vOK(M.bonus)&&M.bonus.table){ const bo=calcBonus(); add(bo.pts!=null?"ok":"warn",M.bonus.label,bo.pts!=null?`${M.bonus.rowLabel} ${f1(bo.r1)}% · ${M.bonus.colLabel} ${f1(bo.sum)}% → 예상 ${bo.pts}점`:"인원 미입력","bonus"); if(M.bonus.selfMax&&bo.selfR>M.bonus.selfMax) add("bad",M.bonus.label,`자율 제외 ${f1(bo.selfR)}% — ${M.bonus.selfMax}% 이내`,"bonus"); }
  if(M.gov.on){ (M.gov.required||[]).forEach(rq=>{ const re=new RegExp(rq.match), must=new RegExp(rq.must); const g=D.gov.filter(x=>re.test(x.name)); const miss=g.filter(x=>!must.test(x.members||"")); if(g.length) add(miss.length?"bad":"ok",M.gov.label,miss.length?`${rq.label} 미포함: ${miss.map(x=>x.name).join(", ")}`:`${rq.label} 포함(${g.map(x=>x.name).join(", ")})`,"gov"); }); if(!D.gov.length) add("warn",M.gov.label,"조직 미입력","gov"); }
  return L;
}

function ruleDraft(doc,s){ const pr=prof(), y=pr.years, ts=relTasks(s), ks=relKpis(s); const g=(s.guide||[]).filter(x=>!/^증빙/.test(x)).map(shortG).filter(Boolean);

  $("#main").innerHTML=h; renderTour(); if(keep)window.scrollTo(0,y); else window.scrollTo(0,0);

function renderTour(){ const el=$("#tour"); if(!P||!P.demo||TOURI<0||!TOUR[TOURI]){el.hidden=true;return;} const s=TOUR[TOURI]; el.hidden=false;
  el.innerHTML=`<div class="row" style="justify-content:space-between"><span class="tstep">데모 안내 ${TOURI+1} / ${TOUR.length}</span><button class="btn ghost sm" data-act="tourClose" aria-label="안내 닫기">닫기</button></div><h4>${esc(s.t)}</h4><p>${esc(s.b)}</p>${s.act?`<button class="btn pri sm" data-act="${esc(s.act)}" ${s.actData?Object.entries(s.actData).map(([k,x])=>`data-${k}="${esc(x)}"`).join(" "):""}>${esc(s.actLabel)}</button>`:""}<div class="row" style="justify-content:space-between"><div class="dots">${TOUR.map((x,i)=>`<i class="${i===TOURI?"on":""}"></i>`).join("")}</div><div class="row" style="gap:6px"><button class="btn sm" data-act="tourPrev" ${TOURI===0?"disabled":""}>이전</button><button class="btn sm pri" data-act="tourNext">${TOURI===TOUR.length-1?"마치기":"다음"}</button></div></div>`; }

function readVal(el){ if(el.dataset.bool)return el.checked; if(el.dataset.n)return el.value===""?"":parseFloat(el.value); if(el.dataset.arr)return el.value.split("\n").map(s=>s.trim()).filter(Boolean); if(el.dataset.csv)return el.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean); return el.value; }
document.addEventListener("input",e=>{ const el=e.target; if(!P||!el.dataset||!el.dataset.b||el.type==="checkbox")return; setPath(el.dataset.b,readVal(el)); save(); });
document.addEventListener("change",async e=>{ const el=e.target;
  if(el.id==="projSel"){ if(el.value)await openProject(el.value); return; }
  if(el.id==="showDraft"){ SHOWDRAFT=el.checked; render(true); return; }
  if(el.id==="fileIn"){ await addFiles([...el.files]); el.value=""; return; }
  if(el.id==="jsonIn"){ const f=el.files[0]; el.value=""; if(f)importJSON(await f.text()); return; }
  if(el.dataset&&el.dataset.srcrole){ const s=SOURCES.find(x=>x.id===el.dataset.srcrole); if(s){ s.role=el.value; try{await Store.saveSource(P.id,s)}catch(err){} render(true);} return; }
  if(el.dataset&&el.dataset.b&&P){ setPath(el.dataset.b,readVal(el)); if(/\.(variant|status|group|kind|src|type|chg)$|meta\.flag|modules\..*\.on|bonus$/.test(el.dataset.b))ensureData(prof(),dat()); save(); render(true); } });

function startDemo(){ if(P&&!P.demo)DEMO_BACK=P.id; P=demoProject(); setSave("데모 · 저장 안 함"); SOURCES=[]; PRIOR=null; curSec=""; outTab=""; TOURI=0; go(TOUR[0].go); }
async function exitDemo(silent){ TOURI=-1; setSave(Store.mode==="db"?"공유 저장소 연결":"이 브라우저에 저장"); const back=DEMO_BACK; DEMO_BACK=null; P=null; SOURCES=[]; if(back&&PROJ.find(p=>p.id===back))await openProject(back); else if(PROJ.length)await openProject(PROJ[0].id); else { cur="home"; render(); } if(!silent)toast("데모를 마쳤습니다"); }
function draftErr(err){ return err.code==="not_granted"?"Claude 사용이 허용되지 않았습니다":err.code==="rate_limited"?"요청이 많습니다. 잠시 후 다시 시도해 주세요":err.code==="no_sample"?err.message:err.code==="invalid_json"?"내용(안)을 해석하지 못했습니다. 다시 시도해 주세요":"내용(안)을 만들지 못했습니다: "+(err.message||err.code); }
async function adopt(p){ P=p; SOURCES=[]; Store.save(P); await new Promise(r=>setTimeout(r,50)); PROJ=[{id:p.id,name:p.name,program:p.profile.programName,updatedAt:Date.now()}].concat(PROJ.filter(x=>x.id!==p.id)); try{localStorage.setItem(LKEY+"-last",p.id)}catch(e){} }
async function openProject(id){ const p=await Store.load(id); if(!p){toast("사업을 불러오지 못했습니다");return;} P=p; ensureData(P.profile,P.data); SOURCES=await Store.listSources(id); try{localStorage.setItem(LKEY+"-last",id)}catch(e){} cur="home"; curSec=""; outTab=""; PRIOR=null; render(); }
async function addFiles(files){ if(!P||!files.length)return; for(const f of files){ BUSY=`${f.name} 읽는 중…`; render(true);
    try{ const buf=await f.arrayBuffer(); const outs=await extractFile(f.name,buf); for(const o of outs){ const s={id:"s"+uid(),name:o.name,role:o.error?"attach":guessRole(o.name,o.text),chars:(o.text||"").length,text:o.text||"",error:o.error||""}; if(!s.error&&s.chars<30){s.error="본문 텍스트가 거의 없습니다(스캔 이미지일 수 있음)";} SOURCES.push(s); try{await Store.saveSource(P.id,s)}catch(err){ toast("원문 저장 실패: "+(err.code||err.message)); } } }
    catch(err){ SOURCES.push({id:"s"+uid(),name:f.name,role:"attach",chars:0,text:"",error:err.message||String(err)}); } }
  BUSY=""; render(true); toast("파일을 읽었습니다. 역할(기본계획·서식·전년도 문서)을 확인하세요"); }
function applyPrior(x){ if(!x)return; const D=dat(), pr=prof();
  if(x.meta){ ["org","addr","url"].forEach(k=>{if(x.meta[k])D.meta[k]=x.meta[k]}); if(x.meta.variant&&(pr.variants||[]).includes(x.meta.variant))D.meta.variant=x.meta.variant; }
  if(Array.isArray(x.tasks)&&x.tasks.length)D.tasks=x.tasks.map(t=>({group:String(t.group||""),no:String(t.no||""),name:String(t.name||""),planName:String(t.planName||t.name||""),goal:String(t.goal||""),result:"",status:"",fb:"",next:String(t.next||""),next2:String(t.next2||""),p1:String(t.p1||""),p2:"",p3:"",chg:"유지",chgNote:"",oldName:""}));
  if(Array.isArray(x.kpi)&&x.kpi.length)D.kpi=x.kpi.map(k=>{const v=f=>k[f]===""||k[f]==null?"":n(k[f]);return {name:String(k.name||""),st:String(k.st||"기존"),unit:String(k.unit||""),base:v("base"),t1:v("t1"),t2:v("t2"),t3:v("t3"),act:"",formula:String(k.formula||""),why:String(k.why||""),links:String(k.links||""),src:{base:v("base"),t1:v("t1"),t2:v("t2"),t3:v("t3")}}});
  if(x.b1&&typeof x.b1==="object")Object.entries(x.b1).forEach(([k,v])=>{const key=pr.budgetItems.find(b=>norm(b)===norm(k))||k; if(!pr.budgetItems.includes(key))pr.budgetItems.push(key); D.b1[key]={bud:n(v),exe:""};});
  if(x.area3&&typeof x.area3==="object")Object.entries(x.area3).forEach(([k,v])=>{ if(!pr.budgetAreas.includes(k))pr.budgetAreas.push(k); D.area3[k]=Array.isArray(v)?v.slice(0,3).map(n):["","",""]; });
  const tb=pr.budgetItems.reduce((s,k)=>s+n((D.b1[k]||{}).bud),0); if(tb&&!n(D.meta.totalPrev))D.meta.totalPrev=Math.round(tb*10)/10;
  if(Array.isArray(x.gov)&&x.gov.length)D.gov=x.gov.map(g=>({name:String(g.name||""),func:String(g.func||""),members:String(g.members||""),y1:"",y2:"",out:""}));
  if(Array.isArray(x.findings))D.findings=x.findings.map(f=>({lv:["bad","warn","ok","info"].includes(f.lv)?f.lv:"info",area:String(f.area||""),msg:String(f.msg||""),src:String(f.src||""),fix:String(f.fix||"")}));
  D.preset="전년도 제출 문서에서 추출 ("+SOURCES.filter(s=>s.role==="prior").map(s=>s.name).join(", ")+")";
  ensureData(pr,D); }
function importJSON(t){ let o; try{o=JSON.parse(t)}catch(e){toast("JSON 형식이 아닙니다");return;}
  if(o.kind==="profile"&&o.profile){ if(!P){toast("먼저 사업을 만드세요");return;} P.profile=sanitizeProfile(o.profile,null); Object.assign(P.profile,o.profile); ensureData(P.profile,dat()); save(); render(); toast("사업 구조를 불러왔습니다"); return; }
  if(o.profile&&o.data){ const p=newProject(o.name||o.profile.programName,o.profile,o.data); adopt(p).then(()=>{render();toast("사업을 불러왔습니다");}); return; }
  toast("사업 데이터나 구조 파일이 아닙니다"); }
async function saveFile(name,text){ try{ const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(dl){ await dl.save({filename:name,data:text}); toast("저장했습니다"); return; } }catch(err){ if(err&&err.code==="declined")return; if(err&&err.code&&err.code!=="unavailable"&&err.code!=="not_granted"){toast("저장하지 못했습니다: "+err.code);return;} }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:name.endsWith(".json")?"application/json":"text/html"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }catch(err){ toast("이 보기에서는 파일 저장을 쓸 수 없습니다. 본문 복사를 이용하세요"); } }
function copyDoc(){ const el=$("#docOut"); const html=el.innerHTML; const fb=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"본문을 복사했습니다. 한글·워드 문서에 붙여넣으세요":"본문이 선택되었습니다. Ctrl+C로 복사하세요")};
  try{ if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){ navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([el.innerText],{type:"text/plain"})})]).then(()=>toast("본문을 복사했습니다. 한글·워드 문서에 붙여넣으세요"),fb); return; } }catch(e){} fb(); }

async function boot(){
  $("#main").innerHTML='<p class="busy">불러오는 중…</p>';
  await Store.init(); setSave(Store.mode==="db"?"공유 저장소 연결":"이 브라우저에 저장");
  PROJ=await Store.list(); let last=null; try{last=localStorage.getItem(LKEY+"-last")}catch(e){}
  const wantDemo=/^#demo/i.test(location.hash||"");
  if(wantDemo||!PROJ.length){ startDemo(); if(!wantDemo)toast("처음 방문이라 데모로 시작합니다. 위의 ‘데모 종료’를 누르면 내 사업을 만들 수 있습니다"); }
  else { await openProject(PROJ.find(p=>p.id===last)?last:PROJ[0].id); }
  if(Store.mode==="db"){ try{ Store.db.collection("projects").onSnapshot(q=>{ const L=q.docs.map(d=>{const x=d.data();return {id:d.id,name:x.name,program:x.profile&&x.profile.programName,updatedAt:x.updatedAt||0}}).sort((a,b)=>b.updatedAt-a.updatedAt); const changed=L.map(x=>x.id+x.name).join()!==PROJ.map(x=>x.id+x.name).join(); PROJ=L; if(changed)renderTop(); },()=>{}); }catch(e){} }
}
boot();
